name: Install Spanish thankful collage

on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-spanish-thankful-banner.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Spanish collage from public design preview
        shell: bash
        run: |
          python -m pip install Pillow --quiet
          python - <<'PY'
          import os, io, urllib.request
          from PIL import Image, ImageEnhance
          source="https://design.canva.ai/vbBPywWPxmVB2xt"
          request=urllib.request.Request(source,headers={'User-Agent':'Mozilla/5.0'})
          import json
          try:
              with urllib.request.urlopen(request,timeout=40) as response:
                  data=response.read()
              image=Image.open(io.BytesIO(data)).convert('RGB')
              if image.width < 500 or image.height < 250:
                  raise RuntimeError(f'Preview unexpectedly small: {image.size}')
              print('Source resolution:',image.size)
              image=image.resize((1788,1005),Image.Resampling.LANCZOS)
              image=ImageEnhance.Sharpness(image).enhance(1.08)
              os.makedirs('images',exist_ok=True)
              image.save('images/one-hope-thankful-banner-es.jpg',quality=90,optimize=True,subsampling=0)
              state={'result':'success','preview_dimensions':[596,335],'output_dimensions':[1788,1005]}
              print('Spanish church collage saved.')
          except Exception as error:
              state={'result':'failed','error_type':type(error).__name__,'message':str(error)[:150]}
          os.makedirs('data',exist_ok=True)
          with open('data/spanish-banner-install-status.json','w') as f: json.dump(state,f,indent=2)
          PY
      - name: Commit permanently hosted image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spanish-banner-install-status.json
          if [ -f images/one-hope-thankful-banner-es.jpg ]; then git add images/one-hope-thankful-banner-es.jpg; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Spanish church thankful collage to images"
          git pull --rebase origin main
          git push origin HEAD:main

# Rerun after the workflow exists on the default branch.
