name: Install bilingual church collages

on:
  push:
    branches: [main]
    paths:
      - scripts/import_church_banners.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-church-collages
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install pillow
      - name: Retrieve bilingual original collages
        run: python scripts/import_church_banners.py
      - name: Commit both images to main
        run: |
          git add images/one-hope-thankful-banner.jpg images/one-hope-thankful-banner-es.jpg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add original English and Spanish church collage banners"
          git pull --rebase origin main
          git push origin HEAD:main
