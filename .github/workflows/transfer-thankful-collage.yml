name: Transfer Spanish collage from Canva
on:
  push:
    branches: [main]
    paths: ['.github/workflows/transfer-thankful-collage.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CANVA_URL: 'https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F4761a31d-7ec1-4a87-972c-8b19629b4dad/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAD0VV4NDa64GUoM2iEWD_6aR0v0kaDdwgZKu8LO3qGT6&exp=1792312585&osig=AAAAAAAAAAAAAAAAAAAAADghb6qGGszmSjKz7loqFQAwrSGDs3xbyTGPBVrbPYMg&signer=media-rpc&token=AAIAAU0AJDQ3NjFhMzFkLTdlYzEtNGE4Ny05NzJjLThiMTk2MjliNGRhZAAAAAABoU4nqyh8n9eJiPfrMLuw8_sAS7gQfdGO9GuL_elEhwHrCE3FZg&x-canva-quality=thumbnail'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original and high-resolution download candidates
        shell: bash
        run: |
          python -m pip install Pillow --quiet
          python - <<'PY'
          import os, urllib.request, urllib.error, json, io
          from PIL import Image
          u=os.environ['CANVA_URL']
          tests={
            'original': u,
            'resized_2048': u.replace('/height:112/','/height:1152/').replace('/width:200?', '/width:2048?'),
            'resized_1024': u.replace('/height:112/','/height:576/').replace('/width:200?', '/width:1024?'),
            'width_only': u.replace('/width:200?', '/width:2048?'),
            'height_only': u.replace('/height:112/', '/height:1152/'),
          }
          results={}
          for name, url in tests.items():
            try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as res:
                data=res.read()
              im=Image.open(io.BytesIO(data))
              results[name]={'status':'OK','width':im.width,'height':im.height,'bytes':len(data)}
            except Exception as e:
              results[name]={'status':type(e).__name__,'detail':str(e)[:90]}
          os.makedirs('data',exist_ok=True)
          with open('data/canva-image-transfer-test.json','w') as out: json.dump(results,out,indent=2)
          print(json.dumps(results,indent=2))
          PY
      - name: Save diagnostic results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/canva-image-transfer-test.json
          git commit -m 'Check Spanish banner asset transfer quality' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
