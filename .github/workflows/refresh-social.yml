name: Refresh social feeds

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "social-sources.json"
      - "scripts/refresh_social.py"

permissions:
  contents: write

concurrency:
  group: one-hope-social-feed-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new public posts
        run: python scripts/refresh_social.py
      - name: Save changed feeds
        shell: bash
        run: |
          if git diff --quiet -- data/youtube.json data/instagram.json; then
            echo "No new posts to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json data/instagram.json
          git commit -m "Automatically refresh church social feeds"
          git pull --rebase origin main
          git push origin HEAD:main
